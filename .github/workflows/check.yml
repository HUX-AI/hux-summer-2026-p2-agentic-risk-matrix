# Runs on every pull request.
#
# Its job is to stop a broken change BEFORE it reaches the live site. If this
# fails, read the red text in the log — it is written in plain language and
# tells you which file and which line to fix.
name: Check content

on:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate content files
        run: npm run check
      - name: Build the site (preview mode, drafts visible)
        run: npm run build
        env:
          SHOW_DRAFTS: 'true'
